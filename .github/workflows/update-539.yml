name: 摘星怪今彩539每日同步

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 20:35–20:55 / 21:00–21:55 / 22:00–22:30，每 5 分鐘
    # UTC = 台灣時間 - 8 小時
    - cron: '35,40,45,50,55 12 * * *'
    - cron: '*/5 13 * * *'
    - cron: '0,5,10,15,20,25,30 14 * * *'

permissions:
  contents: write

concurrency:
  group: zhaixingguai539-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取得儲存庫
        uses: actions/checkout@v4
      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 從官方資料驗證並更新 draws.json
        run: python scripts/update_draws.py
      - name: 只有資料變更才提交
        run: |
          if git diff --quiet -- draws.json; then
            echo '沒有新資料，不提交'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add draws.json
          git commit -m '自動更新今彩539開獎資料'
          git push
